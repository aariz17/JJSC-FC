    function applyCrestFallbackToImg(imgEl) {
      if (!imgEl || imgEl.dataset.crestBound === '1') return;
      imgEl.dataset.crestBound = '1';
      let idx = 0;

      function tryNext() {
        if (idx < LOGO_CANDIDATES.length) {
          imgEl.src = LOGO_CANDIDATES[idx++];
        } else {
          imgEl.removeEventListener('error', tryNext);
          const wrapper = document.createElement('div');
          wrapper.className = 'w-full h-full flex items-center justify-center';
          wrapper.innerHTML = FALLBACK_CREST_SVG_HTML;
          imgEl.replaceWith(wrapper);
        }
      }

      imgEl.addEventListener('error', tryNext);
      if (imgEl.complete && imgEl.naturalWidth === 0) {
        tryNext();
      }
    }

    // 3D Crest Sanctum Tilt & Click-to-Pop Main Three
    (function init3DCrest() {
      const stage = document.getElementById('jjsc-3d-stage');
      const card = document.getElementById('jjsc-3d-card');
      const glare = document.getElementById('jjsc-3d-glare');
      const spinBtn = document.getElementById('jjsc-spin-crest-btn');
      if (!stage || !card) return;

      let rx = 0, ry = 0, trx = 0, tryY = 0;
      let pointerInside = false;
      let autoPhase = 0;
      let downPos = { x: 0, y: 0 };

      stage.addEventListener('pointerenter', () => { pointerInside = true; });
      stage.addEventListener('pointermove', e => {
        pointerInside = true;
        const rect = card.getBoundingClientRect();
        const nx = ((e.clientX - rect.left) / rect.width - 0.5) * 2;
        const ny = ((e.clientY - rect.top) / rect.height - 0.5) * 2;
        tryY = nx * 24;
        trx = -ny * 20;
        if (glare) {
          const gx = ((e.clientX - rect.left) / rect.width) * 100;
          const gy = ((e.clientY - rect.top) / rect.height) * 100;
          glare.style.background = `radial-gradient(circle at ${gx}% ${gy}%, rgba(255,255,255,0.42), rgba(250,204,21,0.12) 45%, transparent 72%)`;
        }
      });
      stage.addEventListener('pointerleave', () => {
        pointerInside = false;
        trx = 0;
        tryY = 0;
      });

      card.addEventListener('pointerdown', e => { downPos = { x: e.clientX, y: e.clientY }; });
      card.addEventListener('click', e => {
        if (Math.hypot(e.clientX - downPos.x, e.clientY - downPos.y) < 10) {
          openMainThree('all');
        }
      });

      spinBtn?.addEventListener('click', () => {
        tryY += 360;
        showToast('3D Crest showcase spin!');
      });

      function tick() {
        if (!pointerInside) {
          autoPhase += 0.018;
          tryY = Math.sin(autoPhase) * 14;
          trx = Math.cos(autoPhase * 0.75) * 7;
        }
        rx += (trx - rx) * 0.14;
        ry += (tryY - ry) * 0.14;
        card.style.transform = `rotateX(${rx.toFixed(2)}deg) rotateY(${ry.toFixed(2)}deg)`;
        requestAnimationFrame(tick);
      }
      requestAnimationFrame(tick);
    })();

    function encodeUtf8Base64(str) {
      const bytes = new TextEncoder().encode(str);
      let bin = '';
      bytes.forEach(b => { bin += String.fromCharCode(b); });
      return btoa(bin);
    }

    function decodeUtf8Base64(b64) {
      const bin = atob(b64);
      const bytes = new Uint8Array(bin.length);
      for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
      return new TextDecoder().decode(bytes);
    }

    function renderPitchTokens() {

      pitchPositions.forEach(pt => {

        const token = document.createElement('div');
        token.className = 'pitch-token absolute -translate-x-1/2 -translate-y-1/2 flex flex-col items-center cursor-grab';
        token.style.left = `${pt.x}%`;
        token.style.top = `${pt.y}%`;
        token.innerHTML = `
          <div class="w-11 h-11 sm:w-12 sm:h-12 rounded-full bg-navy-950/95 border-2 ${player.id === selectedPlayerId ? 'border-gold-400 shadow-[0_0_16px_rgba(250,204,21,0.75)]' : 'border-white/75'} flex items-center justify-center font-jersey font-bold text-xl text-gold-300">

            ${esc(player.name)} · ${player.goals}G/${player.assists}A
          </span>
        `;

        token.addEventListener('pointerdown', e => {
          e.preventDefault();
          selectedPlayerId = player.id;
          updateInspector();
          renderPitchTokens();
          token.classList.add('dragging');
          const surface = document.getElementById('pitch-3d-surface');
          if (!surface) return;

          function onMove(ev) {
            const rect = surface.getBoundingClientRect();
            const nx = Math.min(Math.max(((ev.clientX - rect.left) / rect.width) * 100, 6), 94);
            const ny = Math.min(Math.max(((ev.clientY - rect.top) / rect.height) * 100, 8), 92);
            pt.x = nx;
            pt.y = ny;
            token.style.left = `${nx}%`;
            token.style.top = `${ny}%`;
            updateInspector();
          }

          function onUp() {
            token.classList.remove('dragging');
            window.removeEventListener('pointermove', onMove);
            window.removeEventListener('pointerup', onUp);
            localStorage.setItem('jjsc_pitch_positions_v1', JSON.stringify(pitchPositions));
          }

          window.addEventListener('pointermove', onMove);
          window.addEventListener('pointerup', onUp);
        });

        layer.appendChild(token);
      });
    }

      const ctx = canvas.getContext('2d');
      let visible = true;
      let sparks = [];

      function resize() {
        canvas.width = canvas.offsetWidth;
        canvas.height = canvas.offsetHeight;
        sparks = Array.from({ length: 28 }, () => ({
          x: Math.random() * canvas.width,
          y: Math.random() * canvas.height,
          r: 1 + Math.random() * 2.2,
          vy: -(0.25 + Math.random() * 0.55),
          a: 0.2 + Math.random() * 0.55
        }));

      resize();
      window.addEventListener('resize', resize);

      if ('IntersectionObserver' in window) {
        new IntersectionObserver(entries => {
          visible = entries[0]?.isIntersecting ?? true;
        }, { threshold: 0.05 }).observe(canvas);
      }

      function draw() {
        if (visible && canvas.width && canvas.height) {
          ctx.clearRect(0, 0, canvas.width, canvas.height);
          sparks.forEach(s => {
            s.y += s.vy;
            if (s.y < -10) s.y = canvas.height + 10;
            ctx.beginPath();
            ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
            ctx.fillStyle = `rgba(250, 204, 21, ${s.a})`;
            ctx.fill();
          });
        }
        requestAnimationFrame(draw);
      }
      requestAnimationFrame(draw);
    })();

    renderSquad();
    initJerseyStudio();
    initTacticsBoard();
  </script>
